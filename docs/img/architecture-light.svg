<text x="1060" y="150" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5C605D" text-anchor="middle" letter-spacing="0" opacity="1">the default, your Apple account</text>
