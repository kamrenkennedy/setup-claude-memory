<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Family memory: you and your partner each keep your own private memory, and both of your Claudes read one shared iCloud folder before answering a family question. It holds a markdown file of shared facts, a facts.json for lookups, and an append-only changelog. Writes go one section at a time so two people never overwrite each other.">
