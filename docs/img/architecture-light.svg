<rect x="62" y="234" width="166" height="36" rx="10" fill="#F3EDDF" stroke="#1E2A38" stroke-width="2"/>
<text x="145" y="258" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E2A38" text-anchor="middle" letter-spacing="0" opacity="1">Claude Code</text>
<text x="145" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#8A8F8B" text-anchor="middle" letter-spacing="0" opacity="1">reads ~/.claude/CLAUDE.md</text>
