<rect x="4" y="150" width="48" height="22" rx="11" fill="#FAF9F7" stroke="#FAF9F7" stroke-width="4"/>
<line x1="12" y1="160" x2="44" y2="160" stroke="#FAF9F7" stroke-width="2.5" stroke-linecap="round"/>
<path d="M-104,10 C-150,30 -160,80 -132,112" fill="none" stroke="#FAF9F7" stroke-width="12" stroke-linecap="round"/>
<path d="M104,10 C150,30 158,70 148,96" fill="none" stroke="#FAF9F7" stroke-width="12" stroke-linecap="round"/>
<circle cx="-134" cy="118" r="17" fill="#FAF9F7" stroke="#FAF9F7" stroke-width="4"/>
<circle cx="150" cy="104" r="17" fill="#FAF9F7" stroke="#FAF9F7" stroke-width="4"/>
<path d="M140,86 a12,12 0 0 1 24,0 v8" fill="none" stroke="#FAF9F7" stroke-width="4"/>
<rect x="134" y="92" width="36" height="28" rx="6" fill="#7FA0B4" stroke="#FAF9F7" stroke-width="4"/>
<circle cx="152" cy="106" r="3.5" fill="#FAF9F7"/>
<rect x="-98" y="-118" width="210" height="250" rx="20" fill="url(#dots)"/>
<rect x="-105" y="-125" width="210" height="250" rx="20" fill="#262624" stroke="#FAF9F7" stroke-width="5"/>
<rect x="-84" y="-142" width="76" height="26" rx="9" fill="#D4674F" stroke="#FAF9F7" stroke-width="4"/>
<line x1="-105" y1="-90" x2="105" y2="-90" stroke="#FAF9F7" stroke-width="3" stroke-opacity="0.35"/>
<ellipse cx="-40" cy="-40" rx="22" ry="26" fill="#FAF9F7" stroke="#FAF9F7" stroke-width="4"/>
<circle cx="-34" cy="-36" r="9" fill="#FAF9F7"/>
<circle cx="-31" cy="-40" r="3" fill="#FAF9F7"/>
<ellipse cx="40" cy="-40" rx="22" ry="26" fill="#FAF9F7" stroke="#FAF9F7" stroke-width="4"/>
