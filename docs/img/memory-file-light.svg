<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Your memory file: memory.jsonl is one JSON object per line. Each line is one memory. Delete a line and Claude forgets that one thing.">
<defs>
  <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <circle cx="2" cy="2" r="1.25" fill="#1E2A38" fill-opacity="0.16"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2E6E73"/>
  </marker>
  <marker id="arrowInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1E2A38"/>
  </marker>
</defs><rect width="1200" height="250" fill="#F2EBDD"/>
<rect x="47" y="47" width="860" height="172" rx="16" fill="url(#dots)"/>
<rect x="40" y="40" width="860" height="172" rx="16" fill="#FBF7EE" stroke="#1E2A38" stroke-width="3"/>
<text x="62" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#1E2A38" text-anchor="start" letter-spacing="0" opacity="1">memory.jsonl</text>
<text x="62" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1E2A38" text-anchor="start" letter-spacing="0" opacity="1">{"type":"entity","name":"Alex","entityType":"person","observations":["works in film","moved to Nashville in 2024"]}</text>
<text x="62" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1E2A38" text-anchor="start" letter-spacing="0" opacity="1">{"type":"entity","name":"Greenhouse shoot","entityType":"project","observations":["drone pass first"]}</text>
<text x="62" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9AA09C" text-anchor="start" letter-spacing="0" opacity="1">{"type":"entity","name":"Old apartment","entityType":"place","observations":["lease ends in June"]}</text>
<line x1="60" y1="152" x2="720" y2="152" stroke="#C96F4A" stroke-width="2" stroke-linecap="round"/>
<text x="62" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1E2A38" text-anchor="start" letter-spacing="0" opacity="1">{"type":"relation","from":"Alex","to":"Greenhouse shoot","relationType":"directs"}</text>
<rect x="930" y="56" width="170" height="30" rx="15.0" fill="#D6E4E1" stroke="#2E6E73" stroke-width="2"/>
<text x="1015.0" y="75.0" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2E6E73" text-anchor="middle" letter-spacing="1.2" opacity="1">one line, one memory</text>
<rect x="930" y="100" width="242" height="30" rx="15.0" fill="#F1D9CC" stroke="#C96F4A" stroke-width="2"/>
<text x="1051.0" y="119.0" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1E2A38" text-anchor="middle" letter-spacing="1.2" opacity="1">delete a line, it forgets that</text>
<text x="930" y="160" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5C605D" text-anchor="start" letter-spacing="0" opacity="1">Plain text. Opens in TextEdit.</text>
<text x="930" y="180" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5C605D" text-anchor="start" letter-spacing="0" opacity="1">Nothing to export, nothing to decode.</text>
<text x="930" y="200" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5C605D" text-anchor="start" letter-spacing="0" opacity="1">Delete the file and you start over.</text>
</svg>
