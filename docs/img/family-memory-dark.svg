<rect x="324.2" y="322" width="552" height="30" rx="15.0" fill="#26383F" stroke="#7FA0B4" stroke-width="2"/>
<text x="600.0" y="341.0" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7FA0B4" text-anchor="middle" letter-spacing="1.2" opacity="1">writes go one section at a time, so two people never overwrite each other</text>
<text x="600" y="380" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7C807D" text-anchor="middle" letter-spacing="0" opacity="1">Routed by a block the installer adds to ~/.claude/CLAUDE.md on each Mac. Insurance, house, pets, shared money.</text>
<text x="600" y="400" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7C807D" text-anchor="middle" letter-spacing="0" opacity="1">Templates never overwrite your edits. Run it again any time.</text>
