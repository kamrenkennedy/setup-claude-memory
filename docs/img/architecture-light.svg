<text x="348" y="154" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C605D" text-anchor="start" letter-spacing="0" opacity="1">Knowledge graph. Facts, status, relations.</text>
<text x="348" y="172" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C605D" text-anchor="start" letter-spacing="0" opacity="1">Search returns matching lines, never a</text>
