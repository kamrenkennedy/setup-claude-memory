<text x="760" y="62" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8A8F8B" text-anchor="middle" letter-spacing="2.2" opacity="1">YOUR FILES</text>
<text x="1060" y="62" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8A8F8B" text-anchor="middle" letter-spacing="2.2" opacity="1">SYNC, YOUR ACCOUNTS</text>
<rect x="47" y="127" width="210" height="200" rx="16" fill="url(#dots)"/>
<rect x="40" y="120" width="210" height="200" rx="16" fill="#FBF7EE" stroke="#1E2A38" stroke-width="3"/>
