<text x="760" y="350" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8A8F8B" text-anchor="middle" letter-spacing="0" opacity="1">plain text, yours to open</text>
