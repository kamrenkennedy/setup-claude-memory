<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="How setup-claude-memory works: your Claude talks over MCP to two servers from this package, which read and write plain files in your memory folder; the folder syncs through iCloud Drive by default or a private GitHub repo you own, with a secret scan before every push. An optional shared family folder is read before family questions.">
<defs>
  <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <circle cx="2" cy="2" r="1.25" fill="#1E2A38" fill-opacity="0.16"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2E6E73"/>
  </marker>
  <marker id="arrowInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1E2A38"/>
  </marker>
</defs><rect width="1200" height="640" fill="#F2EBDD"/>
<text x="145" y="62" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8A8F8B" text-anchor="middle" letter-spacing="2.2" opacity="1">YOUR CLAUDE</text>
