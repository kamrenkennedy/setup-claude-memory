<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Where your memory goes: it is stored on your Mac as plain files, synced by your own iCloud or private GitHub account, and sent to Anthropic with each conversation the same as anything you type. There is no Kam Studios server; nothing phones home.">
<defs>
  <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
    <circle cx="2" cy="2" r="1.25" fill="#FAF9F7" fill-opacity="0.12"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7FA0B4"/>
  </marker>
  <marker id="arrowInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#FAF9F7"/>
  </marker>
</defs><rect width="1200" height="520" fill="#1A1A1A"/>
<circle cx="190" cy="262" r="128" fill="#33403A"/>
<circle cx="190" cy="262" r="128" fill="url(#dots)"/>
<g transform="translate(190,256) scale(0.66)">
<ellipse cx="0" cy="182" rx="118" ry="9" fill="#000000" fill-opacity="0.35"/>
