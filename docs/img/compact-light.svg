<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Archiving with --compact: a project entity full of finished status notes; the tool proposes moves grouped by why, you approve each group, and the finished notes move to an archive entity where they stay searchable. Anything holding the last copy of an identifier is flagged and never bulk-approved. Nothing is ever deleted.">
