<circle cx="49" cy="-40" r="3" fill="#FAF9F7"/>
<path d="M-62,-78 q22,-10 44,-2" fill="none" stroke="#FAF9F7" stroke-width="4" stroke-linecap="round"/>
<path d="M18,-80 q22,-8 44,4" fill="none" stroke="#FAF9F7" stroke-width="4" stroke-linecap="round"/>
<path d="M-28,10 q28,26 56,0" fill="none" stroke="#FAF9F7" stroke-width="4" stroke-linecap="round"/>
<rect x="-75" y="44" width="124" height="9" rx="4.5" fill="#7FA0B4" fill-opacity="0.85"/>
