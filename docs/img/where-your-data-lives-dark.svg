</g>
<text x="190" y="448" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7C807D" text-anchor="middle" letter-spacing="2.2" opacity="1">YOUR MEMORY</text>
<rect x="447" y="47" width="480" height="96" rx="16" fill="url(#dots)"/>
<rect x="440" y="40" width="480" height="96" rx="16" fill="#262624" stroke="#FAF9F7" stroke-width="3"/>
<text x="460" y="70" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FAF9F7" text-anchor="start" letter-spacing="0" opacity="1">Your Mac</text>
<text x="460" y="94" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A8ACA9" text-anchor="start" letter-spacing="0" opacity="1">Plain files you can open, read, or edit any time.</text>
<text x="460" y="112" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A8ACA9" text-anchor="start" letter-spacing="0" opacity="1">Delete a line to forget it. Delete the file to start over.</text>
<polyline points="330,262 432,88" fill="none" stroke="#7FA0B4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="393.24" y="158.12" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A8ACA9" text-anchor="middle" letter-spacing="0" opacity="1" paint-order="stroke" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round">stored as</text>
<rect x="447" y="157" width="480" height="96" rx="16" fill="url(#dots)"/>
<rect x="440" y="150" width="480" height="96" rx="16" fill="#262624" stroke="#FAF9F7" stroke-width="3"/>
<text x="460" y="180" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FAF9F7" text-anchor="start" letter-spacing="0" opacity="1">Your accounts</text>
<text x="460" y="204" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A8ACA9" text-anchor="start" letter-spacing="0" opacity="1">iCloud Drive by default, or a private GitHub repo you own.</text>
<text x="460" y="222" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A8ACA9" text-anchor="start" letter-spacing="0" opacity="1">Nobody else has a login. Not even Kam Studios.</text>
<polyline points="330,262 432,198" fill="none" stroke="#7FA0B4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="393.24" y="226.32" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A8ACA9" text-anchor="middle" letter-spacing="0" opacity="1" paint-order="stroke" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round">synced by</text>
<rect x="447" y="267" width="480" height="96" rx="16" fill="url(#dots)"/>
<rect x="440" y="260" width="480" height="96" rx="16" fill="#262624" stroke="#FAF9F7" stroke-width="3"/>
<text x="460" y="290" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FAF9F7" text-anchor="start" letter-spacing="0" opacity="1">Anthropic, with each conversation</text>
<text x="460" y="314" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A8ACA9" text-anchor="start" letter-spacing="0" opacity="1">The same as anything you type into Claude. Your plan's</text>
<text x="460" y="332" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A8ACA9" text-anchor="start" letter-spacing="0" opacity="1">data policy is the one that applies, and it is the only third party.</text>
<polyline points="330,262 432,308" fill="none" stroke="#7FA0B4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="393.24" y="294.52" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A8ACA9" text-anchor="middle" letter-spacing="0" opacity="1" paint-order="stroke" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round">sent with</text>
<rect x="440" y="370" width="480" height="96" rx="16" fill="none" stroke="#5E625F" stroke-width="2" stroke-dasharray="7 7"/>
<text x="460" y="400" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#5E625F" text-anchor="start" letter-spacing="0" opacity="1">A Kam Studios server</text>
<text x="460" y="424" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E625F" text-anchor="start" letter-spacing="0" opacity="1">Does not exist. Nothing phones home, nothing is collected,</text>
<text x="460" y="442" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E625F" text-anchor="start" letter-spacing="0" opacity="1">and the code that proves it is the code in this repo.</text>
<line x1="330" y1="262" x2="400" y2="418" stroke="#5E625F" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round" opacity="0.8"/>
<circle cx="412" cy="426" r="11" fill="#1A1A1A" stroke="#D4674F" stroke-width="2.5"/>
<line x1="405" y1="419" x2="419" y2="433" stroke="#D4674F" stroke-width="2.5" stroke-linecap="round"/>
<text x="365.0" y="332.0" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#D4674F" text-anchor="middle" letter-spacing="0" opacity="1" paint-order="stroke" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round">never</text>
</svg>
