<text x="348" y="304" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C605D" text-anchor="start" letter-spacing="0" opacity="1">Long-form archive. Session notes,</text>
<text x="348" y="322" font-family="Manrope, Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C605D" text-anchor="start" letter-spacing="0" opacity="1">decisions, research. Keyword and</text>
